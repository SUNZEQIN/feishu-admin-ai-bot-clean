server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: feishu-admin-ai-bot-clean
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/feishu_admin_bot?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:feishu_bot}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-mysql.sql

logging:
  level:
    com.sunzeqin.feishuadmin: ${APP_LOG_LEVEL:INFO}

feishu:
  base-url: ${FEISHU_BASE_URL:https://open.feishu.cn}
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}
  verification-token: ${FEISHU_VERIFICATION_TOKEN:}
  processing-reply-enabled: ${FEISHU_PROCESSING_REPLY_ENABLED:true}
  processing-reply-text: ${FEISHU_PROCESSING_REPLY_TEXT:⏳ 正在处理，请稍等...}
  processing-reaction-types: ${FEISHU_PROCESSING_REACTION_TYPES:Get,OnIt}
  oauth-redirect-uri: ${FEISHU_OAUTH_REDIRECT_URI:}
  oauth-authorize-base-url: ${FEISHU_OAUTH_AUTHORIZE_BASE_URL:https://accounts.feishu.cn}
  oauth-default-scopes: ${FEISHU_OAUTH_DEFAULT_SCOPES:offline_access}
  oauth-refresh-before-seconds: ${FEISHU_OAUTH_REFRESH_BEFORE_SECONDS:600}
  llm-enabled: ${FEISHU_LLM_ENABLED:false}
  llm-base-url: ${FEISHU_LLM_BASE_URL:https://api.deepseek.com}
  llm-api-key: ${FEISHU_LLM_API_KEY:}
  llm-model-name: ${FEISHU_LLM_MODEL_NAME:deepseek-chat}
  llm-temperature: ${FEISHU_LLM_TEMPERATURE:0.0}
  memory-enabled: ${FEISHU_MEMORY_ENABLED:true}
  memory-max-messages: ${FEISHU_MEMORY_MAX_MESSAGES:20}
  cli-enabled: ${FEISHU_CLI_ENABLED:true}
  cli-command: ${FEISHU_CLI_COMMAND:lark-cli}
  cli-max-steps: ${FEISHU_CLI_MAX_STEPS:15}
  cli-timeout-seconds: ${FEISHU_CLI_TIMEOUT_SECONDS:60}
  cli-allowed-domains: ${FEISHU_CLI_ALLOWED_DOMAINS:im,base,docs,calendar,vc,minutes,note,contact,approval,attendance,drive,wiki,markdown,mindnotes,whiteboard}
  ecommerce-mcp-enabled: ${FEISHU_ECOMMERCE_MCP_ENABLED:false}
  ecommerce-mcp-base-url: ${FEISHU_ECOMMERCE_MCP_BASE_URL:http://127.0.0.1:8090}
